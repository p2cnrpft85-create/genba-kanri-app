}

const site=id=>state.sites.find(s=>s.id===id);const jobsOn=k=>state.jobs.filter(j=>j.dates.includes(k));const sitesOn=k=>[...new Set(jobsOn(k).map(j=>j.sid))].map(site).filter(Boolean);const allDays=()=>new Date(ui.year,ui.month,0).getDate();const monthDays=()=>Array.from({length:allDays()},(_,i)=>dateKey(ui.year,ui.month,i+1));const btn=(txt,action,cls='')=>`<button class="${cls}" data-action="${action}">${txt}</button>`;const input=(id,label,value='',type='text')=>`<label>${label}<input id="${id}" type="${type}" value="${esc(value)}"></label>`;const title=()=>`<div class="row"><button data-action="prev">‹ 前月</button><strong>${ui.year}年${ui.month}月</strong><button data-action="next">翌月 ›</button></div>`;const slotName=i=>site(state.slots[i])?.name||'未選択';function calendar(){

 let weeks=Math.ceil((offset+allDays())/7);
 let html=`<section class="panel">${title()}<div class="weekhead">${['月','火','水','木','金','土','日'].map(x=>`<div>${x}</div>`).join('')}</div>`;

function siteScheduleText(sid){
 const dates=[...new Set(state.jobs.filter(j=>j.sid===sid).flatMap(j=>j.dates||[]))].sort();
 if(!dates.length)return '予定なし';
 const fmt=k=>{const [y,m,d]=k.split('-');return Number(y)+'/'+Number(m)+'/'+Number(d)};
 const next=k=>{const [y,m,d]=k.split('-').map(Number);const t=new Date(y,m-1,d+1);return dateKey(t.getFullYear(),t.getMonth()+1,t.getDate())};
 const ranges=[];let start=dates[0],end=start;
 for(let i=1;i<dates.length;i++){if(dates[i]===next(end)){end=dates[i]}else{ranges.push(start===end?fmt(start):fmt(start)+'〜'+fmt(end));start=end=dates[i]}}
 ranges.push(start===end?fmt(start):fmt(start)+'〜'+fmt(end));return ranges.join('、');
}
function sitesPage(){let html=`<section class="panel"><div class="row"><h2>現場一覧</h2>${btn('＋新規現場','newSite','primary')}</div>`;for(const s of state.sites){html+=`<div class="site"><div class="flex"><div class="swatch" style="background:${s.color}"></div><div class="grow"><strong>${esc(s.name)}</strong><div class="muted">${esc(s.company)}</div><div class="site-schedule">📅 ${esc(siteScheduleText(s.id))}</div></div>${btn(ui.opened===s.id?'閉じる':'開く','open:'+s.id)}</div>`;if(ui.opened===s.id){html+=`<div class="stack" style="margin-top:10px">${input('rename','現場名',s.name)}${input('recompany','会社名',s.company)}<div class="colors">${colors.map(c=>`<button style="background:${c}" data-action="siteColor:${s.id}:${c}" class="${s.color===c?'active':''}"></button>`).join('')}</div><div class="actions">${btn('名前・会社名を保存','saveSite:'+s.id)}${btn('この現場に予定追加','siteJob:'+s.id)}${btn('現場を削除','deleteSite:'+s.id,'danger')}</div><h3>現場写真</h3><div class="photos" id="photos">`;for(const p of state.photos.filter(p=>p.sid===s.id)){html+=`<div class="photo-card"><img class="photo" role="button" tabindex="0" data-action="viewPhoto:${p.id}" style="cursor:zoom-in" src="${esc(p.path?(photoLinks[p.path]||''):p.url||'')}" alt="現場写真"><div class="small">${esc(p.title)}</div>${btn('削除','delPhoto:'+p.id)}</div>`}html+=`</div><label>共有写真を選択<input type="file" accept="image/*" id="photoFile" multiple></label>${input('photoCaption','写真の説明')}<div class="muted">写真は承認済み社員だけが共有できます。</div>${btn('写真を登録','addPhoto:'+s.id,'primary')}</div>`}html+='</div>'}return html+'</section><section class="panel"><h2>会社内共有</h2><p class="muted">ログイン済みメンバーで予定・現場・写真を同期します。社員は会社共通アカウントでログインします。アカウントの作成と利用許可は管理者が行ってください。</p></section>'}
function memosPage(){const mode=memberProfile?.role==='admin'?ui.memoMode:'shared',items=memoState[mode];return `<section class="panel"><h2>フリーメモ</h2><div class="actions"><button data-action="memoMode:shared" class="${mode==='shared'?'active':''}">会社共有メモ</button>${memberProfile?.role==='admin'?`<button data-action="memoMode:private" class="${mode==='private'?'active':''}">自分だけのメモ</button>`:''}</div><p class="muted">${mode==='shared'?'社員全員で閲覧・編集できます':'自分のアカウントだけで閲覧・編集できます'}</p><label>タイトル<input id="freeTitle" placeholder="メモのタイトル"></label><label>内容<textarea id="freeBody" rows="5" placeholder="自由に記入"></textarea></label><div class="actions">${btn(ui.memoEdit?'変更を保存':'＋ メモを追加','saveFreeMemo','primary')}${ui.memoEdit?btn('編集をやめる','cancelFreeMemo'):''}</div></section><section class="panel"><h2>${mode==='shared'?'共有':'個人'}メモ一覧（${items.length}件）</h2>${items.map(m=>`<div class="site"><strong>${esc(m.title||'無題')}</strong><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(m.body||'')}</p><div class="actions">${btn('編集','editFreeMemo:'+m.id)}${btn('削除','deleteFreeMemo:'+m.id,'danger')}</div></div>`).join('')||'<p class="muted">まだメモがありません</p>'}</section>`}
async function loadPhotoLinks(){if(!supabase||!signedUser)return;const missing=state.photos.filter(p=>p.path&&(!photoLinks[p.path]||Date.now()-(photoLinkTimes[p.path]||0)>8*60*1000));if(!missing.length)return;const entries=await Promise.all(missing.map(async p=>{try{const {data,error}=await photoBucket().createSignedUrl(p.path,600);if(error)throw error;return [p.path,data.signedUrl]}catch(e){console.warn(e);return [p.path,null]}}));entries.forEach(([path,url])=>{if(url){photoLinks[path]=url;photoLinkTimes[path]=Date.now()}});if(ui.tab==='sites')render()}
function render(){if(!signedUser||!ready)return;if(ui.tab==='register'){const n=document.getElementById('siteName'),c=document.getElementById('companyName');if(n)draft.name=n.value;if(c)draft.company=c.value}document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===ui.tab));document.getElementById('app').innerHTML=(ui.notice?`<div class="notice">${esc(ui.notice)}</div>`:'')+(ui.tab==='calendar'?calendar():ui.tab==='register'?register():ui.tab==='memos'?memosPage():ui.tab==='admin'?adminPage():sitesPage());if(ui.tab==='sites')loadPhotoLinks()}function changeMonth(n){const d=new Date(ui.year,ui.month-1+n,1);ui.year=d.getFullYear();ui.month=d.getMonth()+1;render()}function startRegister(s='new',dates=[]){draft={name:'',company:''};ui.tab='register';ui.site=String(s);ui.edit=null;ui.selected=[...dates];ui.notes={};ui.range=false;ui.start=null;ui.color=4;ui.notice='';render()}document.addEventListener('change',e=>{if(e.target.id==='registerSite'){ui.site=e.target.value;document.getElementById('newFields').classList.toggle('hidden',ui.site!=='new')}if(e.target.id==='range'){ui.range=e.target.checked;ui.start=null}});document.addEventListener('input',e=>{if(e.target.dataset.note)ui.notes[e.target.dataset.note]=e.target.value});document.addEventListener('click',async e=>{const nav=e.target.closest('[data-tab]');if(nav){if(nav.dataset.tab==='admin'&&memberProfile?.role!=='admin')return;if(nav.dataset.tab==='register')return startRegister();ui.tab=nav.dataset.tab;ui.notice='';render();return}const d=e.target.closest('[data-day]');if(d){ui.day=d.dataset.day;ui.focus=null;render();return}const p=e.target.closest('[data-pick]');if(p){let k=p.dataset.pick;if(ui.range){if(!ui.start)ui.start=k;else{let a=ui.start<=k?ui.start:k,b=ui.start<=k?k:ui.start;let cursor=new Date(a+'T12:00:00'),end=new Date(b+'T12:00:00');while(cursor<=end){ui.selected.push(dateKey(cursor.getFullYear(),cursor.getMonth()+1,cursor.getDate()));cursor.setDate(cursor.getDate()+1)}ui.selected=[...new Set(ui.selected)].sort();ui.start=null}}else ui.selected=ui.selected.includes(k)?ui.selected.filter(x=>x!==k):[...ui.selected,k].sort();render();return}const a=e.target.closest('[data-action]');if(!a)return;const [cmd,x,y]=a.dataset.action.split(':');if(!ready||!signedUser)return;if(cmd==='memoMode'){if(x==='private'&&memberProfile?.role!=='admin')return;ui.memoMode=x;ui.memoEdit=null;return render()}if(cmd==='cancelFreeMemo'){ui.memoEdit=null;return render()}if(cmd==='editFreeMemo'){if(ui.memoMode==='private'&&memberProfile?.role!=='admin')return;const m=memoState[ui.memoMode].find(m=>m.id===x);if(!m)return;ui.memoEdit=x;render();document.getElementById('freeTitle').value=m.title||'';document.getElementById('freeBody').value=m.body||'';return}if(cmd==='saveFreeMemo'){if(ui.memoMode==='private'&&memberProfile?.role!=='admin')return;const title=document.getElementById('freeTitle').value.trim(),body=document.getElementById('freeBody').value.trim();if(!title&&!body)return alert('タイトルか内容を入力してください');const id=ui.memoEdit||uid(),r=ui.memoMode==='shared'?doc(db,'freeMemos',id):doc(db,'users',signedUser.uid,'freeMemos',id);try{await setDoc(r,{title,body,updatedAt:Date.now(),updatedBy:signedUser.uid});ui.memoEdit=null;render()}catch(ex){alert('メモの保存に失敗しました: '+ex.message)}return}if(cmd==='deleteFreeMemo'){if(ui.memoMode==='private'&&memberProfile?.role!=='admin')return;if(!confirm('このメモを削除しますか？'))return;const r=ui.memoMode==='shared'?doc(db,'freeMemos',x):doc(db,'users',signedUser.uid,'freeMemos',x);try{await deleteDoc(r)}catch(ex){alert('削除に失敗しました: '+ex.message)}return}if(cmd==='prev'||cmd==='next')return changeMonth(cmd==='prev'?-1:1);if(cmd==='addDay')return startRegister('new',[ui.day]);if(cmd==='newSite')return startRegister();if(cmd==='focus'){ui.focus=ui.focus===x?null:x;return render()}if(cmd==='slot'){let i=Number(x),sid=y,other=1-i;if(state.slots[other]===sid)state.slots[other]=state.slots[i];state.slots[i]=sid;save();return render()}if(cmd==='memo'){let j=state.jobs.find(j=>j.id===x);j.notes={...j.notes,[ui.day]:document.getElementById('dayMemo').value};save();ui.notice='メモを保存しました';return render()}if(cmd==='edit'){draft={name:'',company:''};let j=state.jobs.find(j=>j.id===x);ui.edit=j.id;ui.site=j.sid;ui.selected=[...j.dates];ui.notes={...j.notes};ui.tab='register';return render()}if(cmd==='photos'){ui.tab='sites';ui.opened=x;return render()}if(cmd==='clear'){ui.selected=[];ui.start=null;return render()}if(cmd==='color'){ui.color=Number(x);return render()}if(cmd==='saveJob'){if(!ui.selected.length)return alert('日付を選択してください');let sid=ui.site;if(sid==='new'){let name=document.getElementById('siteName').value.trim(),company=document.getElementById('companyName').value.trim();if(!name||!company)return alert('現場名と会社名を入力してください');sid=uid();state.sites.push({id:sid,name,company,color:colors[ui.color??4]})}if(ui.edit){let j=state.jobs.find(j=>j.id===ui.edit);j.sid=sid;j.dates=[...ui.selected];j.notes={...ui.notes}}else{let j=state.jobs.find(j=>j.sid===sid);if(j){j.dates=[...new Set([...j.dates,...ui.selected])].sort();j.notes={...j.notes,...ui.notes}}else state.jobs.push({id:uid(),sid,dates:[...ui.selected],notes:{...ui.notes}})}if(!state.slots[0])state.slots[0]=sid;else if(!state.slots[1]&&state.slots[0]!==sid)state.slots[1]=sid;save();draft={name:'',company:''};ui.selected=[];ui.edit=null;ui.tab='calendar';ui.notice='予定を保存しました';return render()}if(cmd==='deleteDay'){let j=state.jobs.find(j=>j.id===x);if(!j||!j.dates.includes(ui.day))return;const name=site(j.sid)?.name||'この現場';if(confirm(name+' の '+ui.day+' の予定を削除しますか？\nほかの日の予定は残ります。')){j.dates=j.dates.filter(k=>k!==ui.day);if(j.notes)delete j.notes[ui.day];if(!j.dates.length)state.jobs=state.jobs.filter(item=>item.id!==j.id);save();ui.focus=null;ui.notice='この日の予定を削除しました';render()}return}if(cmd==='deleteJob'){if(confirm('この現場の登録済み予定をすべて削除しますか？')){state.jobs=state.jobs.filter(j=>j.id!==ui.edit);save();ui.tab='calendar';render()}return}if(cmd==='open'){ui.opened=ui.opened===x?null:x;return render()}if(cmd==='deleteSite'){const target=site(x);if(!target)return;const related=state.jobs.filter(j=>j.sid===x),pictures=state.photos.filter(p=>p.sid===x);const message='現場「'+target.name+'」を削除しますか？\nこの現場の予定 '+related.length+' 件と写真 '+pictures.length+' 枚も削除対象です。\n会社全員の共有データから消え、元に戻せません。';if(!confirm(message))return;for(const p of pictures){if(p.path){try{await photoBucket().remove([p.path]).then(({error})=>{if(error)throw error})}catch(ex){alert('写真の削除に失敗しました。現場はまだ削除していません。 '+ex.message);return}}}state.photos=state.photos.filter(p=>p.sid!==x);state.jobs=state.jobs.filter(j=>j.sid!==x);state.sites=state.sites.filter(item=>item.id!==x);state.slots=state.slots.map(id=>id===x?null:id);ui.opened=null;ui.focus=null;await save();ui.notice='現場を削除しました';return render()}if(cmd==='siteColor'){site(x).color=y;save();return render()}if(cmd==='saveSite'){site(x).name=document.getElementById('rename').value.trim()||site(x).name;site(x).company=document.getElementById('recompany').value.trim()||site(x).company;save();return render()}if(cmd==='siteJob')return startRegister(x);if(cmd==='addPhoto'){if(!signedUser)return alert('写真を登録するにはログインが必要です');const files=[...document.getElementById('photoFile').files];if(!files.length)return alert('写真を選んでください');const caption=document.getElementById('photoCaption').value;let uploaded=0;for(const f of files){if(f.size>4*1024*1024){alert('4MB以下の写真を選んでください');continue}try{const id=uid(),path=`sitePhotos/${x}/${id}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const {error}=await photoBucket().upload(path,f,{contentType:f.type||'image/jpeg',upsert:false});if(error)throw error;state.photos.push({id,sid:x,title:caption||f.name,path});uploaded++}catch(ex){alert('写真のアップロードに失敗しました。 '+ex.message)}}if(uploaded)await save();return render()}if(cmd==='delPhoto'){const p=state.photos.find(p=>p.id===x);if(!p||!confirm('この写真を削除しますか？'))return;try{if(p.path)await photoBucket().remove([p.path]).then(({error})=>{if(error)throw error})}catch(ex){alert('写真ファイルの削除に失敗しました: '+ex.message);return}state.photos=state.photos.filter(p=>p.id!==x);await save();return render()}});// Photo viewer: only photos belonging to the opened site are navigable.
let viewerPhotos=[],viewerIndex=0,viewerScale=1,viewerX=0,viewerY=0;
function photoViewerElements(){return {root:document.getElementById('photoViewer'),img:document.getElementById('photoViewerImg'),stage:document.getElementById('photoViewerStage')}}
function photoViewerSetTransform(){const {img}=photoViewerElements();if(img)img.style.transform=`translate(${viewerX}px,${viewerY}px) scale(${viewerScale})`}
function photoViewerShow(){const p=viewerPhotos[viewerIndex];if(!p)return;const {root,img}=photoViewerElements();if(!root)return;const src=p.path?photoLinks[p.path]:p.url;viewerScale=1;viewerX=viewerY=0;img.src=src||'';photoViewerSetTransform();document.getElementById('photoViewerTitle').textContent=p.title||'現場写真';document.getElementById('photoViewerCounter').textContent=`${viewerIndex+1} / ${viewerPhotos.length}`;document.getElementById('photoViewerPrev').hidden=viewerPhotos.length<2;document.getElementById('photoViewerNext').hidden=viewerPhotos.length<2;root.hidden=false;document.body.style.overflow='hidden'}
async function openPhotoViewer(id){const p=state.photos.find(p=>p.id===id);if(!p)return;viewerPhotos=state.photos.filter(q=>q.sid===p.sid);viewerIndex=viewerPhotos.findIndex(q=>q.id===id);const missing=viewerPhotos.filter(q=>q.path&&!photoLinks[q.path]);if(missing.length){await Promise.all(missing.map(async q=>{try{const {data,error}=await photoBucket().createSignedUrl(q.path,600);if(!error&&data?.signedUrl){photoLinks[q.path]=data.signedUrl;photoLinkTimes[q.path]=Date.now()}}catch(e){console.warn(e)}}))}photoViewerShow()}
function closePhotoViewer(){const {root,img}=photoViewerElements();if(root)root.hidden=true;if(img)img.removeAttribute('src');document.body.style.overflow=''}
function stepPhotoViewer(delta){if(!viewerPhotos.length)return;viewerIndex=(viewerIndex+delta+viewerPhotos.length)%viewerPhotos.length;photoViewerShow()}
async function saveViewerPhoto(){const p=viewerPhotos[viewerIndex];if(!p)return;try{const src=p.path?photoLinks[p.path]:p.url;if(!src)throw Error('写真を読み込めません');const response=await fetch(src);if(!response.ok)throw Error('写真を取得できません');const blob=await response.blob();const ext=(blob.type.split('/')[1]||'jpg').replace('jpeg','jpg');const safeName=(p.title||'現場写真').replace(/[\\/:*?"<>|]/g,'_').slice(0,40);const file=new File([blob],`${safeName}.${ext}`,{type:blob.type||'image/jpeg'});if(navigator.canShare?.({files:[file]})&&navigator.share){await navigator.share({files:[file],title:'現場写真'});return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}catch(e){if(e.name==='AbortError')return;alert('保存できませんでした。写真を長押しして保存するか、Safariで開いてください。')}}
function initPhotoViewer(){const root=document.createElement('div');root.id='photoViewer';root.className='photo-viewer';root.hidden=true;root.innerHTML=`<div class="photo-viewer-head"><button id="photoViewerClose">閉じる ✕</button><span id="photoViewerTitle" class="photo-viewer-title"></span><span id="photoViewerCounter" class="photo-viewer-counter"></span></div><div id="photoViewerStage" class="photo-viewer-stage"><button id="photoViewerPrev" class="photo-viewer-arrow photo-viewer-prev" aria-label="前の写真">‹</button><img id="photoViewerImg" alt="拡大した現場写真"><button id="photoViewerNext" class="photo-viewer-arrow photo-viewer-next" aria-label="次の写真">›</button></div><div class="photo-viewer-foot"><span style="font-size:12px">左右スワイプで写真切替・2本指で拡大</span><button id="photoViewerSave">保存・共有</button></div>`;document.body.appendChild(root);document.getElementById('photoViewerClose').onclick=closePhotoViewer;document.getElementById('photoViewerPrev').onclick=()=>stepPhotoViewer(-1);document.getElementById('photoViewerNext').onclick=()=>stepPhotoViewer(1);document.getElementById('photoViewerSave').onclick=saveViewerPhoto;
const stage=document.getElementById('photoViewerStage');let startX=0,startY=0,startDistance=0,startScale=1,startPanX=0,startPanY=0,wasPinch=false;
const distance=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
stage.addEventListener('touchstart',e=>{if(e.target.closest('button'))return;if(e.touches.length===2){wasPinch=true;startDistance=distance(e.touches);startScale=viewerScale}else if(e.touches.length===1){wasPinch=false;startX=e.touches[0].clientX;startY=e.touches[0].clientY;startPanX=viewerX;startPanY=viewerY}},{passive:true});
stage.addEventListener('touchmove',e=>{if(e.target.closest('button'))return;if(e.touches.length===2&&startDistance){viewerScale=Math.max(1,Math.min(5,startScale*distance(e.touches)/startDistance));if(viewerScale===1)viewerX=viewerY=0;photoViewerSetTransform();e.preventDefault()}else if(e.touches.length===1&&viewerScale>1){viewerX=startPanX+e.touches[0].clientX-startX;viewerY=startPanY+e.touches[0].clientY-startY;photoViewerSetTransform();e.preventDefault()}},{passive:false});
stage.addEventListener('touchend',e=>{if(e.target.closest('button'))return;if(!e.touches.length){if(!wasPinch&&viewerScale===1&&e.changedTouches.length){const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)stepPhotoViewer(dx<0?1:-1)}startDistance=0}});
window.addEventListener('keydown',e=>{if(root.hidden)return;if(e.key==='Escape')closePhotoViewer();if(e.key==='ArrowLeft')stepPhotoViewer(-1);if(e.key==='ArrowRight')stepPhotoViewer(1)})}
initPhotoViewer();
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('img[data-action^="viewPhoto:"]')){e.preventDefault();openPhotoViewer(e.target.dataset.action.slice(10))}});
document.addEventListener('click',e=>{const img=e.target.closest('img[data-action^="viewPhoto:"]');if(img){e.preventDefault();openPhotoViewer(img.dataset.action.slice(10))}},true);
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
